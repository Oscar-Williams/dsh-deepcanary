name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22.19.0
          - os: ubuntu-latest
            node: 24.19.0
          - os: windows-latest
            node: 22.19.0
          - os: windows-latest
            node: 24.19.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify:environment
      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- lib
      - run: npm run verify:distribution
      - run: npm pack --dry-run

  host-contracts:
    name: DSH ${{ matrix.host }} / Node ${{ matrix.node }} contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: 0.2.1-rc.5
            node: 22.19.0
          - host: 0.2.2-alpha.3
            node: 24.19.0
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_RUNTIME: ${{ github.workspace }}/.ci-dsh-runtime
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm install --prefix .ci-dsh-runtime --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@${{ matrix.host }}
      - run: npm run typecheck:host
      - run: npm run adapter:host
      - run: npm run background:host
      - run: npm run reminders:host
      - run: npm run settings:host
      - run: npm run connection:host

  browser-smoke:
    name: DSH 0.2.1-rc.5 WebUI smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DSH_HOME: ${{ github.workspace }}/.ci-dsh-deepcanary-home
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install the released DSH 0.2.1-rc.5 runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund pnpm@11.28.5
          npm install --global --prefix "$RUNNER_TEMP/dsh" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.1-rc.5
          echo "$RUNNER_TEMP/dsh/bin" >> "$GITHUB_PATH"
          export PATH="$RUNNER_TEMP/dsh/bin:$PATH"
          dsh --version
      - name: Install a package into an isolated web profile
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          artifact=$(find "$RUNNER_TEMP" -maxdepth 1 -name 'dsh-deepcanary-*.tgz' -print -quit)
          test -n "$artifact"
          dsh plugin --profile web add "$artifact"
          dsh --profile web --dump-config | grep -F 'dsh-deepcanary'
      - name: Install Chromium for Playwright CLI
        shell: bash
        run: npx --yes --package @playwright/cli playwright-cli install-browser chromium
      - name: Start the isolated DSH Web server
        shell: bash
        run: |
          set -euo pipefail
          dsh web --no-open --port 43135 > "$RUNNER_TEMP/dsh-web.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/dsh-web.pid"
          for _ in $(seq 1 60); do
            if grep -q '^dsh web: http' "$RUNNER_TEMP/dsh-web.log"; then
              break
            fi
            if ! kill -0 "$(cat "$RUNNER_TEMP/dsh-web.pid")" 2>/dev/null; then
              sed -E 's/(token=)[^&[:space:]]*/\1[REDACTED]/g' "$RUNNER_TEMP/dsh-web.log"
              exit 1
            fi
            sleep 1
          done
          url=$(sed -n 's/^dsh web: //p' "$RUNNER_TEMP/dsh-web.log" | tail -n 1)
          test -n "$url"
          token=$(printf '%s' "$url" | sed -n 's/.*[?&]token=\([^&]*\).*/\1/p')
          test -n "$token"
          echo "::add-mask::$token"
          printf 'DSH_URL=%s\n' "$url" >> "$GITHUB_ENV"
      - name: Check API admission before browser authentication
        shell: bash
        run: |
          set -euo pipefail
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:43135/api/dsh-deepcanary/health)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Origin: https://untrusted.example' http://127.0.0.1:43135/api/dsh-deepcanary/health)" = 403
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -H 'Host: untrusted.example' http://127.0.0.1:43135/api/dsh-deepcanary/health)" = 403
      - name: Exercise the panel in a real browser
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/playwright
          code=$(node scripts/ci-browser-smoke.mjs)
          npx --yes --package @playwright/cli playwright-cli --session ci open "$DSH_URL"
          npx --yes --package @playwright/cli playwright-cli --session ci run-code "$code"
      - name: Stop the isolated DSH Web server
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/dsh-web.pid"; then
            kill "$(cat "$RUNNER_TEMP/dsh-web.pid")" 2>/dev/null || true
          fi
      - name: Redact the browser smoke log
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/dsh-web.log"; then
            sed -E 's/(token=)[^&[:space:]]*/\1[REDACTED]/g' "$RUNNER_TEMP/dsh-web.log" > "$GITHUB_WORKSPACE/.ci-dsh-web-redacted.log"
          fi
      - name: Upload redacted browser smoke log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: host-web-smoke-log
          path: |
            ${{ github.workspace }}/.ci-dsh-web-redacted.log
            output/playwright/ci-host-forced-colors.png
          if-no-files-found: ignore
